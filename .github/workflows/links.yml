name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README and site links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path docs/_config.yml
            --exclude '^https://(www\.)?(reddit\.com|linkedin\.com|x\.com|twitter\.com)/'
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            README.md contributing.md docs/index.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
